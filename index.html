async function logout(){await push();if(sync.startsWith('Нет связи')&&!lo){lo=1;setTimeout(()=>lo=0,4000);return toast('> НЕТ СВЯЗИ: последние записи не ушли в облако. Нажми «Выйти» ещё раз, чтобы выйти и потерять их')}
 lo=0;await sb.auth.signOut();try{localStorage.removeItem(K);localStorage.removeItem(K+'_bak')}catch(e){}st=fresh();un={};closeS();tab='s';toast('> ВЫХОД ВЫПОЛНЕН');render()}
/* Экран входа: без аккаунта приложением пользоваться нельзя */
function gate(on){const G=$('gate');if(!on){G.style.display='none';G.innerHTML='';G.dataset.f='';return}if(G.dataset.f)return;G.dataset.f='1';
 G.innerHTML=`<div class="pn"><h1>[СИСТЕМА] ВХОД</h1><span class="dim">Войди, чтобы продолжить. Данные хранятся в облаке и доступны на всех твоих устройствах.</span>
 <form onsubmit="event.preventDefault();login()" style="margin-top:10px"><input id="em" type="email" autocomplete="email" placeholder="почта" required><input id="pw" type="password" autocomplete="current-password" placeholder="пароль (от 8 символов)" required>
 <div class="row"><button type="submit">Войти</button><button type="button" onclick="signup()">Регистрация</button></div><button type="button" onclick="forgot()" style="border-color:var(--dim);color:var(--dim)">Забыл пароль</button></form></div>`;G.style.display='block'}
function newPw(){SH.innerHTML=`<div class="box"><h2>НОВЫЙ ПАРОЛЬ</h2><input id="npw" type="password" autocomplete="new-password" placeholder="от 8 символов" style="width:100%"><div class="row"><button onclick="setPw()">Сохранить</button><button onclick="closeS()">Закрыть</button></div></div>`;SH.style.display='block'}
async function setPw(){const p=$('npw').value;if(p.length<8)return toast('> МИНИМУМ 8 СИМВОЛОВ');const{error}=await sb.auth.updateUser({password:p});if(error)return toast('> ОШИБКА: '+error.message);toast('> ПАРОЛЬ ИЗМЕНЁН');closeS()}
if(sb){$('gate').innerHTML='<div class="pn"><h1>[СИСТЕМА] ЗАГРУЗКА…</h1></div>';$('gate').style.display='block'}
if(sb)sb.auth.onAuthStateChange((ev,s)=>{const was=user&&user.id;user=s?s.user:null;gate(!user);
 if(ev=='PASSWORD_RECOVERY')setTimeout(newPw,0);
 if(user&&user.id!=was)setTimeout(async()=>{await pull();if(!st.prof)onb()},0);if(!user)sync='';if(tab=='d')setTimeout(vD,0)});
/* ПРОФИЛЬ И АНКЕТА */
const SPORT=['pl','ft','ag'];
function profPanel(){const p=st.prof;if(!p)return `<div class="pn"><b>ПРОФИЛЬ</b><br><span class="dim">Анкета не заполнена.</span><div class="row"><button onclick="onb()">Заполнить анкету</button></div></div>`;const a=age();
 return `<div class="pn"><b>ПРОФИЛЬ</b><br>${esc(p.name)}${a!=null?', '+yrs(a):''} · ${p.sex=='f'?'женщина':'мужчина'}${p.h?' · рост '+p.h+' см':''} · вес ${BW()} кг (категория ${B.pl.cls} кг)<br>Допуски: прыжки ${st.doc?'[✓]':'[ ]'} · нагрузка на плечо ${st.ortho?'[✓]':'[ ]'}<div class="row"><button onclick="onb(1)">Изменить анкету</button></div></div>`}
function setPanel(){return `<div class="pn"><b>НАСТРОЙКИ</b><br>Тема:<div class="chips" style="margin:6px 0">${THEMES.map(([v,n])=>`<button class="${(st.th||'')==v?'on':''}" onclick="setTh('${v}')">${n}</button>`).join('')}</div><div class="row"><button class="${st.crt?'on':''}" onclick="crt()">Эффект ЭЛТ: ${st.crt?'вкл':'выкл'}</button></div></div>`}
let A=null,As=0;
function onb(edit){const p=st.prof||{},bs=st.base||{};A={name:p.name||'',bd:p.bd||'',sex:p.sex||'m',h:p.h||'',bw:st.bw||'',b0:bs[0]||'',b1:bs[1]||'',b2:bs[2]||'',jump:!!st.doc,sh:!!st.ortho,lv:{},edit:!!edit};
 Object.keys(B).forEach(b=>{if(!SPORT.includes(b))A.lv[b]=Math.min(2,st.r[b]||0)});As=0;onbR()}
function onbGet(){const v=id=>$(id)?$(id).value.trim():null;
 if(As==0){A.name=v('o_nm');A.bd=v('o_bd')}
 if(As==1){A.h=+v('o_h')||'';A.bw=+String(v('o_bw')).replace(',','.')||'';A.b0=+v('o_b0')||'';A.b1=+v('o_b1')||'';A.b2=+v('o_b2')||''}}
function onbOk(){if(As==0){if(!A.name)return toast('> ВВЕДИ ИМЯ');const a=A.bd?(()=>{const b=new Date(A.bd+'T00:00');return(Date.now()-b)/(365.25*DAY)})():NaN;if(!(a>=10&&a<=100))return toast('> ПРОВЕРЬ ДАТУ РОЖДЕНИЯ')}
 if(As==1){if(!(A.bw>=30&&A.bw<=300))return toast('> ВЕС ТЕЛА: 30–300 КГ');if(A.h&&!(A.h>=100&&A.h<=250))return toast('> РОСТ: 100–250 СМ');if([A.b0,A.b1,A.b2].some(x=>x&&!(x>=10&&x<=500)))return toast('> МАКСИМУМЫ: 10–500 КГ')}
 return true}
function onbNav(d){onbGet();if(d>0&&!onbOk())return;As+=d;if(As>3)return onbDone();onbR()}
function onbR(){const O=$('onb'),stp=['ЗНАКОМСТВО','ТЕЛО И СИЛА','ДОПУСКИ ВРАЧЕЙ','СТАРТОВЫЙ УРОВЕНЬ'];let h=`<div class="pn"><h1>[СИСТЕМА] АНКЕТА</h1><span class="dim">Шаг ${As+1} из 4 · ${stp[As]}</span><br>`;
 if(As==0)h+=`<span class="dim">По анкете приложение подберёт нормы и стартовые ранги.</span><label>Имя</label><input id="o_nm" maxlength="40" value="${esc(A.name)}" autocomplete="given-name"><label>Дата рождения</label><input id="o_bd" type="date" value="${A.bd}"><label>Пол <span class="dim">(от него зависят нормы)</span></label><div class="row"><button class="${A.sex=='m'?'on':''}" onclick="onbGet();A.sex='m';onbR()">Мужской</button><button class="${A.sex=='f'?'on':''}" onclick="onbGet();A.sex='f';onbR()">Женский</button></div>`;
 if(As==1){const c=A.bw?wcls(A.sex,A.bw):'—';h+=`<label>Рост, см</label><input id="o_h" type="number" inputmode="numeric" value="${A.h}"><label>Вес тела, кг</label><input id="o_bw" type="number" inputmode="decimal" value="${A.bw}" oninput="$('o_c').textContent=wcls(A.sex,+this.value||0)"><span class="dim">Весовая категория: <b id="o_c">${c}</b> кг</span>
  <label>Максимумы на 1 повтор, кг <span class="dim">(если не знаешь, оставь пустым: уровень посчитается по тренировкам)</span></label><div class="row"><input id="o_b0" type="number" inputmode="decimal" placeholder="присед" value="${A.b0}"><input id="o_b1" type="number" inputmode="decimal" placeholder="жим лёжа" value="${A.b1}"><input id="o_b2" type="number" inputmode="decimal" placeholder="становая" value="${A.b2}"></div>`}
 if(As==2)h+=`<span class="dim">Некоторые упражнения закрыты, пока врач не разрешит. Приложение это не проверяет: отметь сам. Это учёт, а не медицинская рекомендация.</span><div class="row"><button class="${A.jump?'on':''}" onclick="A.jump=!A.jump;onbR()">Врач разрешил прыжки</button><button class="${A.sh?'on':''}" onclick="A.sh=!A.sh;onbR()">Врач разрешил нагрузку на плечо</button></div><span class="dim">Если ограничений нет, отметь оба.</span>`;
 if(As==3){h+=`<span class="dim">Оцени себя в каждой ветке. Выше C · Практик по анкете нельзя: B, A и S даются только за экзамены. Спорт посчитается сам по весам и тренировкам.</span><div class="pn" style="margin:8px 0"><b style="color:var(--r0)">E · Новичок</b>: только начинаю<br><b style="color:var(--r1)">D · Ученик</b>: делаю иногда<br><b style="color:var(--r2)">C · Практик</b>: делаю регулярно</div>`;
  CL.forEach(([cn,it],ci)=>{const bs=it.flatMap(id=>GR[id]?GR[id].c:[id]).filter(b=>!SPORT.includes(b));if(!bs.length)return;h+=`<br><b style="color:var(--c${ci})">${cn}</b>`;
   bs.forEach(b=>{const cr=st.r[b]||0;h+=`<div class="row"><span>${esc(B[b].n)}</span>`+(cr>2?`<span class="dim">${RN[cr]} · ${RNN[cr]} (экзамен)</span>`:[0,1,2].map(k=>`<button class="${A.lv[b]==k?'on':''}" style="color:${A.lv[b]==k?'':rcol(k)}" onclick="A.lv['${b}']=${k};onbR()">${RN[k]}</button>`).join(''))+`</div>`})});
  }
 h+=`<div class="row" style="margin-top:10px">${As?'<button onclick="onbNav(-1)">Назад</button>':''}<button class="on" onclick="onbNav(1)">${As==3?'Готово':'Далее'}</button>${A.edit?'<button onclick="onbClose()">Отмена</button>':''}</div></div>`;
 O.innerHTML=h;O.style.display='block';O.scrollTop=0}
function onbClose(){$('onb').style.display='none';$('onb').innerHTML='';A=null}
function onbDone(){st.prof={name:A.name,bd:A.bd,sex:A.sex,h:A.h||0};st.bw=A.bw;st.base={0:A.b0||0,1:A.b1||0,2:A.b2||0};st.doc=A.jump;st.ortho=A.sh;st.sx=st.sx||{};
 Object.keys(A.lv).forEach(b=>{if((st.r[b]||0)>2)return;const er=Math.max(0,...st.ex.filter(e=>e.b==b).map(e=>e.r));st.r[b]=Math.max(er,A.lv[b]);st.sx[b]=TH[A.lv[b]]});
 const first=!A.edit;onbClose();applyProfile();save();render();toast(first?'> АНКЕТА ПРИНЯТА. ДОБРО ПОЖАЛОВАТЬ, '+st.prof.name.toUpperCase():'> ПРОФИЛЬ ОБНОВЛЁН',first)}
render();
if(!sb&&!st.prof)onb();
</script></body></html>
