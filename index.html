 st.log.filter(e=>!e.m).slice(-12).reverse().forEach(e=>{const T=B[e.b].t[e.i]||['?',''];h+=`<div class="row"><span>${day(new Date(e.t)).slice(5)} · ${lk(e.b)?'ЗАСЕКРЕЧЕНО':T[0]+': '+(e.sets?e.sets.map(s=>s[0]+'×'+s[1]).join(' '):e.v+' '+T[1])} · +${e.x} XP</span>${Date.now()-e.t<DAY?`<button onclick="rm(${e.t})">Отмена</button>`:'<span class="dim" style="flex:0">заперто</span>'}</div>`});
 const hasDemo=st.log.some(e=>e.demo);
 h+=`</div>`+accPanel()+`<div class="pn"><b>ИНСТРУМЕНТЫ</b><div class="row">${hasDemo?'<button onclick="undemo()">Убрать демо</button>':'<button onclick="demo()">Демо-данные</button>'}<button onclick="$('ex').value=JSON.stringify(st)">Экспорт</button><button onclick="imp()">Импорт</button><button id="rs" onclick="reset()">Сброс</button></div>${hasDemo?'<span class="dim">Сейчас в журнале есть демо-записи. Кнопка «Убрать демо» удалит только их.</span>':''}<textarea id="ex" style="width:100%;height:70px" placeholder="Резервная копия: нажми Экспорт и скопируй текст. Для импорта вставь текст сюда."></textarea></div>`;$('d').innerHTML=h}
/* Демо-записи помечены и удаляются отдельно, не трогая настоящие. Закрытые PIN-ветки демо не получают */
function demo(){const ks=Object.keys(B).filter(b=>!LKG[b]&&b!='pl'),now=Date.now();
 for(let d=0;d<60;d++){if(Math.random()<.3)continue;for(let j=0;j<3;j++){const b=ks[Math.floor(Math.random()*ks.length)],i=Math.floor(Math.random()*2),T=B[b].t[i];if(T[9])continue;st.log.push({t:Math.round(now-d*DAY-Math.random()*8e6),b,i,v:T[1]=='мин'?10+Math.floor(Math.random()*50):1+Math.floor(Math.random()*5),x:T[2],demo:1})}}
 st.log.sort((a,b)=>a.t-b.t);save();toast('> ДЕМО-ДАННЫЕ ДОБАВЛЕНЫ');render()}
function undemo(){drop(e=>e.demo);save();toast('> ДЕМО-ДАННЫЕ УДАЛЕНЫ');render()}
function imp(){try{const o=JSON.parse($('ex').value);if(!o||!Array.isArray(o.log))throw 0;st=clean(o);save();toast('> ДАННЫЕ ЗАГРУЖЕНЫ');render()}catch(e){toast('> ОШИБКА: неверный текст копии')}}
function reset(){const b=$('rs');if(!rs){rs=1;b.textContent='Точно? Ещё раз';setTimeout(()=>{rs=0;if($('rs'))$('rs').textContent='Сброс'},3000);return}st=fresh();st.rst=Date.now();rs=0;un={};save();toast(user?'> ВСЕ ДАННЫЕ УДАЛЕНЫ, В ОБЛАКЕ ТОЖЕ':'> ВСЕ ДАННЫЕ УДАЛЕНЫ');render()}
/* ОБЛАКО: Supabase. Ключ publishable публичный по задумке; доступ к строкам закрыт политиками RLS (см. supabase/schema.sql) */
const SB_URL='https://czsccnwayexwiewyutkp.supabase.co',SB_KEY='sb_publishable_PcENrn-tVgk8ovEeAPSCSg_o-ge7v9A',TB='sll_state';
let sb=null,user=null,pushT=0,busy=0,again=0,sync='';
try{if(window.supabase)sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){sb=null}
/* Слияние двух копий: журналы объединяются, удалённое (del) и всё до сброса (rst) отбрасывается, настройки берутся из более свежей копии */
function merge(a,b){const rst=Math.max(a.rst||0,b.rst||0),newer=(x,y)=>(x.rst||0)!=(y.rst||0)?(x.rst||0)>(y.rst||0):(x.ts||0)>=(y.ts||0);
 const[o,n]=newer(a,b)?[b,a]:[a,b],live=[a,b].filter(x=>(x.rst||0)==rst),del=new Set([...a.del,...b.del]);
 const uni=(x,y,key)=>{const m=new Map();[...x,...y].forEach(e=>{if(!del.has(e.t)&&!del.has(e.m)&&e.t>rst)m.set(key(e),e)});return[...m.values()].sort((p,q)=>p.t-q.t)};
 const s=Object.assign({},live.length>1?o:{},n);
 s.log=uni(a.log,b.log,e=>e.t+'|'+e.b+'|'+e.i);s.ex=uni(a.ex,b.ex,e=>e.t+'|'+e.b);
 s.del=[...del].slice(-5000);s.rst=rst;
 s.r={};live.forEach(x=>Object.keys(x.r).forEach(k=>{s.r[k]=Math.max(s.r[k]||0,x.r[k])}));
 s.sick=Object.assign({},...live.map(x=>x.sick));
 if(live.length>1&&a.last!=b.last){const w=a.last>b.last?a:b;s.last=w.last;s.streak=w.streak}
 s.ts=Math.max(a.ts||0,b.ts||0);return s}
function schedPush(){if(!user)return;clearTimeout(pushT);pushT=setTimeout(push,1500)}
async function fetchRemote(){const{data,error}=await sb.from(TB).select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;return data?clean(data.data):null}
async function push(){if(!sb||!user)return;if(busy){again=1;return}busy=1;
 try{const r=await fetchRemote();if(r)st=merge(st,r);saveLocal();
  const{error}=await sb.from(TB).upsert({user_id:user.id,data:st,updated_at:new Date().toISOString()});if(error)throw error;
  sync='Синхронизировано '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}
 catch(e){sync='Нет связи с облаком. Данные сохранены на устройстве, отправлю позже'}
 busy=0;if(tab=='d'&&!SH.style.display.includes('block'))vD();if(again){again=0;push()}}
async function pull(){if(!sb||!user||busy)return;busy=1;
 try{const r=await fetchRemote();if(r){const before=JSON.stringify(st);st=merge(st,r);if(JSON.stringify(st)!=before){saveLocal();render()}}sync='Синхронизировано '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}
 catch(e){sync='Нет связи с облаком'}busy=0;push()}
function accPanel(){if(!sb)return `<div class="pn"><b>ОБЛАКО</b><br><span class="dim">Библиотека облака не загрузилась. Приложение работает только на этом устройстве.</span></div>`;
 if(user)return `<div class="pn"><b>ОБЛАКО</b><br>Аккаунт: ${esc(user.email||'')}<br><span class="dim">${esc(sync||'Синхронизация…')}</span><div class="row"><button onclick="push()">Синхронизировать</button><button onclick="logout()">Выйти</button></div><span class="dim">Записи сохраняются на устройстве и отправляются в облако. Видишь их только ты.</span></div>`;
 return `<div class="pn"><b>ОБЛАКО</b><br><span class="dim">Войди, чтобы данные хранились в облаке и были на всех устройствах. Без входа всё хранится только в этом браузере.</span>
 <input id="em" type="email" autocomplete="email" placeholder="почта" style="width:100%;margin:6px 0"><input id="pw" type="password" autocomplete="current-password" placeholder="пароль (от 8 символов)" style="width:100%;margin:0 0 6px">
 <div class="row"><button onclick="login()">Войти</button><button onclick="signup()">Регистрация</button><button onclick="forgot()">Забыл пароль</button></div></div>`}
const creds=()=>{const e=$('em').value.trim(),p=$('pw').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){toast('> ВВЕДИ ПОЧТУ');return null}return{email:e,password:p}};
const here=()=>location.origin+location.pathname;
async function login(){const c=creds();if(!c)return;const{error}=await sb.auth.signInWithPassword(c);if(error)return toast('> НЕ ВОШЁЛ: неверная почта или пароль');toast('> ВХОД ВЫПОЛНЕН')}
async function signup(){const c=creds();if(!c)return;if(c.password.length<8)return toast('> ПАРОЛЬ: МИНИМУМ 8 СИМВОЛОВ');const{data,error}=await sb.auth.signUp({...c,options:{emailRedirectTo:here()}});if(error)return toast('> ОШИБКА РЕГИСТРАЦИИ: '+error.message);toast(data.session?'> АККАУНТ СОЗДАН':'> ПРОВЕРЬ ПОЧТУ И ПОДТВЕРДИ АДРЕС')}
async function forgot(){const e=$('em').value.trim();if(!e)return toast('> ВВЕДИ ПОЧТУ');await sb.auth.resetPasswordForEmail(e,{redirectTo:here()});toast('> ЕСЛИ АККАУНТ ЕСТЬ, ПИСЬМО ОТПРАВЛЕНО')}
async function logout(){await push();await sb.auth.signOut();toast('> ВЫХОД. ДАННЫЕ ОСТАЛИСЬ НА УСТРОЙСТВЕ');render()}
function newPw(){SH.innerHTML=`<div class="box"><h2>НОВЫЙ ПАРОЛЬ</h2><input id="npw" type="password" autocomplete="new-password" placeholder="от 8 символов" style="width:100%"><div class="row"><button onclick="setPw()">Сохранить</button><button onclick="closeS()">Закрыть</button></div></div>`;SH.style.display='block'}
async function setPw(){const p=$('npw').value;if(p.length<8)return toast('> МИНИМУМ 8 СИМВОЛОВ');const{error}=await sb.auth.updateUser({password:p});if(error)return toast('> ОШИБКА: '+error.message);toast('> ПАРОЛЬ ИЗМЕНЁН');closeS()}
if(sb)sb.auth.onAuthStateChange((ev,s)=>{const was=user&&user.id;user=s?s.user:null;
 if(ev=='PASSWORD_RECOVERY')setTimeout(newPw,0);
 if(user&&user.id!=was)setTimeout(pull,0);if(!user)sync='';if(tab=='d')setTimeout(vD,0)});
render();
</script></body></html>
